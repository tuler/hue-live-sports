<!doctype html>
<!-- The link-preview image (web/public/og-image.png). Render it with headless Chrome; see brand/README.md. -->
<meta charset="utf-8">
<style>
@font-face { font-family: Outfit; font-weight: 500; src: url("../../node_modules/@fontsource/outfit/files/outfit-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: Outfit; font-weight: 700; src: url("../../node_modules/@fontsource/outfit/files/outfit-latin-700-normal.woff2") format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0C1022; }
.card { width: 1200px; height: 630px; display: grid; grid-template-columns: 470px 1fr; align-items: center; gap: 56px; padding: 0 70px; box-sizing: border-box; font-family: Outfit; }
.mark { width: 470px; display: block; }
.word { height: 58px; display: block; margin-bottom: 34px; }
h1 { margin: 0 0 22px; color: #F6F4EF; font-weight: 700; font-size: 54px; line-height: 1.08; letter-spacing: -0.02em; white-space: nowrap; }
p { margin: 0 0 28px; color: #A8AEC6; font-weight: 500; font-size: 26px; line-height: 1.35; }
.url { color: #FF9A3D; font-weight: 700; font-size: 28px; margin: 0; }
</style>
<div class="card">
  <img class="mark" src="../logo/mark-football.svg" alt="">
  <div>
    <img class="word" src="../logo/wordmark-on-dark.svg" alt="Scorelights">
    <h1>Make your living room<br>part of the game</h1>
    <p>Every score flashes your Philips Hue lights in the team's colors.</p>
    <p class="url">scorelights.app</p>
  </div>
</div>
